name: Heroscroll Scraper

on:
  schedule:
    # 00:00 ora italiana → 23:00 UTC (inverno) / 22:00 UTC (estate)
    - cron: "0 23 * * *"
    # 12:00 ora italiana → 11:00 UTC (inverno) / 10:00 UTC (estate)
    - cron: "0 11 * * *"
    # 18:00 ora italiana → 17:00 UTC (inverno) / 16:00 UTC (estate)
    - cron: "0 17 * * *"
  # Permette di eseguire manualmente dalla tab Actions su GitHub
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: heroscroll-scraper/package.json

      - name: Install dependencies
        working-directory: heroscroll-scraper
        run: npm install

      - name: Build TypeScript
        working-directory: heroscroll-scraper
        run: npm run build

      - name: Run scraper
        working-directory: heroscroll-scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: npm start